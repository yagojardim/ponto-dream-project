<title>Meeting Intelligence — Protótipo</title>
<style>
  :root{
    --bg:#09090B; --surface:#16161D; --surface2:#1C1C26; --surface3:#131319;
    --border:#262633; --border2:#2E2E40;
    --t1:#F1F1F5; --t2:#9898AD; --t3:#5C5C7A; --tc:#C7C7D6;
    --accent:#3B82F6; --accentDim:rgba(59,130,246,.12); --accentBorder:rgba(59,130,246,.30);
    --indigo:#6366F1; --purple:#A78BFA;
    --success:#10B981; --successDim:rgba(16,185,129,.12);
    --warn:#F59E0B; --warnDim:rgba(245,158,11,.12);
    --crit:#EF4444; --critDim:rgba(239,68,68,.12);
    --gold:#F5B301; --goldDim:rgba(245,179,1,.13);
    --r-sm:6px; --r-md:10px; --r-lg:14px;
  }
  #notifPanel{position:absolute;top:52px;right:20px;width:380px;max-width:calc(100vw - 32px);background:var(--surface);
    border:1px solid var(--border2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:60;overflow:hidden}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  #shell{display:flex;height:100vh;overflow:hidden}

  /* sidebar */
  aside{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3B82F6,#6366F1);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
  .brand .name{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);padding:10px 8px 4px}
  .nav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;color:var(--t2);font-size:13.5px;
    position:relative;border:1px solid transparent}
  .nav:hover{background:rgba(255,255,255,.03);color:var(--tc)}
  .nav.active{background:var(--accentDim);border-color:var(--accentBorder);color:var(--accent);font-weight:600}
  .nav.active::before{content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
  .nav svg{flex-shrink:0}
  .nav .star{margin-left:auto}

  /* main */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
  .crumb{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:flex;align-items:center;gap:8px}
  .crumb b{color:var(--t2);font-weight:600}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;width:260px;height:34px;padding:0 12px;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--t3);font-size:13px}
  .avatar{width:32px;height:32px;border-radius:99px;background:linear-gradient(135deg,#6366F1,#A78BFA);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .content{flex:1;overflow:auto;padding:28px 32px}

  h1.page{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
  .sub{margin:6px 0 0;font-size:14px;color:var(--t2);line-height:1.6}
  .row-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}

  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);
    font-size:13.5px;font-weight:600;border:1px solid transparent}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#2f74e6}
  .btn-ghost{background:var(--surface2);color:var(--t1);border-color:var(--border)}
  .btn-ghost:hover{border-color:var(--border2)}
  .btn-sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
  .btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accentBorder)}
  .btn-outline:hover{background:var(--accentDim)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600}
  .dot{width:6px;height:6px;border-radius:99px}

  /* list */
  .tabs-filter{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .tf{height:32px;padding:0 14px;display:flex;align-items:center;border-radius:8px;color:var(--t2);font-size:13px;border:1px solid transparent}
  .tf .c{margin-left:6px;color:var(--t3)}
  .tf.active{background:var(--accentDim);border-color:var(--accentBorder);color:var(--accent);font-weight:600}
  .tf.active .c{color:var(--t2)}
  .list-head,.list-row{display:grid;grid-template-columns:1fr 140px 120px 140px 26px;gap:16px;align-items:center;padding:14px 20px}
  .list-head{padding:12px 20px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3)}
  .list-row{border-bottom:1px solid var(--border);cursor:pointer}
  .list-row:last-child{border-bottom:none}
  .list-row:hover{background:rgba(59,130,246,.04)}
  .mtitle{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mmeta{font-size:12px;color:var(--t3)}
  .ico-badge{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--t2)}

  /* detail */
  .tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin:0 0 22px}
  .tab{padding:10px 14px;font-size:13.5px;color:var(--t2);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
  .tab:hover{color:var(--tc)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 296px;gap:22px;align-items:start}
  .sec-title{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
  .ai-badge{width:26px;height:26px;border-radius:7px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.30);
    display:flex;align-items:center;justify-content:center;color:var(--purple);flex-shrink:0}
  .ai-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:11px}
  .chip{height:22px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:11.5px}
  .chip .av{width:16px;height:16px;border-radius:99px;display:inline-block}
  .decision{display:flex;align-items:flex-start;gap:10px}
  .decision span{font-size:14px;line-height:1.6;color:var(--tc)}

  /* transcript */
  .tline{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(38,38,51,.5);font-size:13.5px;line-height:1.6}
  .tline .who{color:var(--tc);font-weight:600;white-space:nowrap}
  .tline .ts{color:var(--t3);font-variant-numeric:tabular-nums}

  /* chat */
  .chatwrap{display:flex;flex-direction:column;height:520px}
  .chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px}
  .msg{max-width:78%;padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);color:var(--tc);border-bottom-left-radius:4px}
  .chatbar{display:flex;gap:10px;margin-top:14px}
  input,textarea,select{font-family:inherit;color:var(--t1);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accentBorder)}
  .chatbar input{flex:1;height:42px;padding:0 14px;font-size:13.5px}

  /* form */
  .field{display:flex;flex-direction:column;gap:7px}
  .label{font-size:12.5px;font-weight:600;color:var(--tc)}
  .field input,.field select{height:40px;padding:0 13px;font-size:13.5px}
  textarea.transcript{min-height:200px;padding:14px 15px;font-size:13px;line-height:1.7;resize:vertical}
  .src-opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 18px;display:flex;align-items:center;gap:10px}
  .src-opt.active{border:1.5px solid var(--accentBorder);background:var(--surface)}
  .src-opt.soon{background:var(--surface3);opacity:.72}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(9,9,11,.8);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal{width:600px;max-width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-lg);
    box-shadow:0 32px 80px rgba(0,0,0,.64);max-height:92vh;overflow:auto}
  .modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border)}
  .modal-b{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
  .modal-f{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:var(--surface3)}
  .quote{display:flex;gap:10px;padding:12px 14px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.22);border-radius:10px;font-size:13px;line-height:1.55;color:var(--tc)}

  /* toast + loader */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:13px;
    display:flex;align-items:center;gap:9px;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:.25s;z-index:80;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:70px 0;color:var(--t2)}
  .spin{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:99px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .recdot{width:12px;height:12px;border-radius:99px;background:var(--crit);animation:pulse 1.2s ease-in-out infinite}
  .eqbars{display:flex;align-items:center;gap:4px;height:48px}
  .eqbars i{width:5px;height:100%;border-radius:3px;background:var(--accent);transform-origin:center;animation:eq 1s ease-in-out infinite}
  .toggle{width:38px;height:22px;border-radius:99px;background:var(--border2);position:relative;transition:.2s;flex-shrink:0}
  .toggle.on{background:var(--accent)}
  .toggle b{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:#fff;transition:.2s}
  .toggle.on b{left:18px}
  .empty{padding:60px 0;text-align:center;color:var(--t3)}

  .banner{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);margin-top:14px}

  /* admin / gestão */
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{height:34px;padding:0 16px;border:0;background:transparent;color:var(--t2);font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .seg button.on{background:var(--accentDim);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentBorder)}
  .kpi4{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{flex:1;min-width:130px;background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .kl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:7px;font-weight:600}
  .kpi .kv{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .ks{font-size:11.5px;color:var(--t3);margin-top:3px}
  .utable{width:100%;border-collapse:collapse;font-size:13.5px}
  .utable th{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .utable td{padding:12px;border-bottom:1px solid var(--border);color:var(--tc);vertical-align:middle}
  .utable tbody tr:last-child td{border-bottom:none}
  .utable tr.totrow td{border-top:1px solid var(--border2);font-weight:700;color:var(--t1)}
  input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:6px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--pct,20%),var(--surface2) var(--pct,20%),var(--surface2) 100%);
    border:1px solid var(--border2);outline:none}
  input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  input[type=range].rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
  input[type=range].rng:focus-visible{outline:2px solid var(--purple);outline-offset:3px}

  @media(max-width:920px){.grid2{grid-template-columns:1fr}.list-head,.list-row{grid-template-columns:1fr 110px 90px 26px}
    .list-head>div:nth-child(4),.list-row>div:nth-child(4){display:none}}
  @media(max-width:680px){aside{display:none}}
</style>

<div id="shell">
  <aside id="sidebar"></aside>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div style="margin-left:auto"></div>
      <button class="btn btn-ghost btn-sm" id="roleBtn" data-role="1" title="Alternar visão (protótipo): Admin master / Usuário" style="gap:6px"></button>
      <button class="btn btn-ghost btn-sm" data-nav="help" title="Ajuda do Meeting Intelligence" style="gap:6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Ajuda</button>
      <button class="btn btn-ghost btn-sm" id="notifBtn" data-notif-toggle="1" title="Notificações" style="position:relative;width:38px;padding:0;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span id="notifDot" hidden style="position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center"></span></button>
      <div class="avatar">YJ</div>
    </div>
    <div id="notifPanel" hidden></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ---------- icons ---------- */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/>',
  tasks:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  projects:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  boards:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="14" rx="1"/>',
  video:'<path d="m16 8 5-3v14l-5-3"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  storage:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8M4.6 9a1.6 1.6 0 0 0-.3-1.8"/>',
  upload:'<path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  spark:'', // filled, handled separately
  check:'<path d="m5 12 5 5L20 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  refresh:'<path d="M12 3v3m0 12v3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M3 12h3m12 0h3"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  link:'<path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/><path d="M15 11h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-4"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  paste:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  download:'<path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
};
const sv=(p,s=1.8,sz=18)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}">${p}</svg>`;
const star=(sz=13,c='#F59E0B')=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${c}"><path d="m12 2 2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>`;
const sparkFill=(sz=14,c='currentColor')=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${c}"><path d="m12 2 2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>`;
const grad=['linear-gradient(135deg,#3B82F6,#6366F1)','linear-gradient(135deg,#6366F1,#A78BFA)','linear-gradient(135deg,#A78BFA,#EC4899)','linear-gradient(135deg,#10B981,#3B82F6)'];

/* ---------- state ---------- */
let issueSeq = 143;

function fallbackCopy(text,done){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}done();}
function copyText(text,okMsg){const done=()=>toast(okMsg);try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}else{fallbackCopy(text,done);}}catch(e){fallbackCopy(text,done);}}
function ataText(m){
  const L=[];
  L.push(m.title);
  L.push(`${m.date}${m.time?' · '+m.time:''} · ${m.dur}`);
  if(m.people&&m.people.length)L.push('Integrantes: '+m.people.map(p=>p.n).join(', '));
  if(m.objetivo)L.push('\nOBJETIVO\n'+m.objetivo);
  if(m.assunto)L.push('\nASSUNTO\n'+m.assunto);
  if(m.itensDiscutidos&&m.itensDiscutidos.length)L.push('\nITENS DISCUTIDOS\n'+m.itensDiscutidos.map(x=>'- '+x).join('\n'));
  if(m.decisions&&m.decisions.length)L.push('\nDECISÕES\n'+m.decisions.map(x=>'- '+x).join('\n'));
  if(m.pontosDefinir&&m.pontosDefinir.length)L.push('\nPONTOS A DEFINIR\n'+m.pontosDefinir.map(x=>'- '+x).join('\n'));
  if(m.actionItems&&m.actionItems.length)L.push('\nPRÓXIMOS PASSOS\n'+m.actionItems.map(a=>`- ${a.text} (Responsável: ${a.assignee||'—'}; Data: ${a.due||'—'})`).join('\n'));
  return L.join('\n');
}
function transcriptText(m){return (m.transcript||[]).map(l=>`[${l.ts}] ${l.who}: ${l.text}`).join('\n');}
function toast(msg){const t=$('#toast');t.innerHTML=`${sv(I.check,2.4,15).replace('stroke="currentColor"','stroke="#10B981"')}<span>${msg}</span>`;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function avatar(g,sz=26){const bg=g<0?'var(--surface2)':grad[g%grad.length];const brd=g<0?'border:1px solid var(--border);':'';return `<span style="width:${sz}px;height:${sz}px;border-radius:99px;background:${bg};${brd}display:inline-flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;flex-shrink:0">${g<0?'+':''}</span>`;}

const canManage=m=>isAdmin||isOwner(m);
function durH(m){const n=parseInt(m.dur,10);return isNaN(n)?0:n/60;}
function savedHours(){return meetings.filter(m=>!m.archived).reduce((s,m)=>s+((m.sharedWith||[]).length)*durH(m),0);}
function initials(name){
  const parts=(name||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length)return '?';
  if(parts.length===1)return parts[0].slice(0,1).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatarStack(list,sz=20,max=3){
  const shown=(list||[]).slice(0,max), extra=(list||[]).length-shown.length;
  const f=Math.round(sz*0.42);
  return `<span style="display:inline-flex;align-items:center;vertical-align:middle">${shown.map((s,i)=>`<span title="${s.n}" style="width:${sz}px;height:${sz}px;border-radius:99px;background:${grad[(s.ag<0?0:s.ag)%grad.length]};border:2px solid var(--surface);${i?'margin-left:-6px':''};display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:${f}px;font-weight:700;letter-spacing:-.02em">${initials(s.n)}</span>`).join('')}${extra>0?`<span style="margin-left:5px;font-size:11px;color:var(--t3)">+${extra}</span>`:''}</span>`;
}
function fmtH(h){const H=Math.floor(h+1e-6);const m=Math.round((h-H)*60);return m?`${H}h${String(m).padStart(2,'0')}`:`${H}h`;}
function stateColor(pct){return pct>=100?'var(--crit)':pct>=80?'var(--warn)':'var(--success)';}
function gauge(pct,size=150){
  pct=Math.max(0,Math.min(100,pct));
  const color=stateColor(pct), R=52, len=Math.PI*R, off=len*(1-pct/100);
  return `<svg viewBox="0 0 120 74" width="${size}" height="${(size*0.62).toFixed(0)}" style="display:block">
    <path d="M 8 60 A 52 52 0 0 1 112 60" fill="none" stroke="var(--surface2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 8 60 A 52 52 0 0 1 112 60" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    <text x="60" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="var(--t1)" style="font-variant-numeric:tabular-nums">${Math.round(pct)}%</text>
  </svg>`;
}

function botReply(m,q){
  const t=q.toLowerCase();
  if(/decis|decid/.test(t)) return m.decisions.length?('As decisões foram: '+m.decisions.map(d=>d.replace(/\.$/,'')).join('; ')+'.'):'Não registrei decisões formais nesta reunião.';
  if(/uma/.test(t)) return 'A Uma ficou responsável por preparar o protótipo navegável das telas de cadastro, com prazo até 30/09.';
  if(/prazo|quando|data/.test(t)) return 'O protótipo navegável ficou para 30/09 e a validação com usuários na semana seguinte.';
  if(/action|tarefa|encaminh/.test(t)) return 'Há '+m.actionItems.length+' action items: '+m.actionItems.map(a=>a.text.toLowerCase()).join('; ')+'.';
  if(/resumo|sobre/.test(t)) return m.summary;
  return 'Com base na transcrição, o foco foi o escopo da fase 1 (cadastro de clientes e gateway de pagamento) e a cadência de sprints. Quer que eu detalhe as decisões ou os action items?';
}

        <div style="flex:1;height:8px;border-radius:5px;background:var(--surface2);overflow:hidden"><span style="display:block;height:100%;width:${p}%;background:${c};border-radius:5px"></span></div>
        <span style="font-variant-numeric:tabular-nums;color:var(--t1);font-weight:600;white-space:nowrap">${fmtH(u.used)} / ${fmtH(u.quota)}</span></div></td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;color:${c};font-weight:600">${Math.round(p)}%</td>
    </tr>`;}).join('');

  $('#view').innerHTML=`
    <div class="seg" style="margin-bottom:18px"><button data-nav="list">Minhas reuniões</button><button class="on">${sv(I.gear,1.8,14)}Gestão do módulo</button></div>
    <div class="row-head" style="align-items:flex-start">
      <div><h1 class="page">Gestão do Meeting Intelligence</h1>
        <p class="sub">Consumo do workspace, cotas por usuário e solicitações — visível apenas para administradores.</p></div>
      <span class="pill" style="margin-left:auto;background:var(--goldDim);color:var(--gold);height:30px">${sv(I.shield,1.8,14)} Admin master</span>
    </div>

    <div class="grid2" style="align-items:start">
      <div style="display:flex;flex-direction:column;gap:18px;min-width:0">

        <div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
            <div class="sec-title" style="margin:0">Consumo do mês</div>
            <div style="font-size:12.5px;color:var(--t3)">Renova em ${tenantUsage.renova}</div>
          </div>
          <div style="display:flex;align-items:flex-end;gap:10px">
            <span style="font-size:34px;font-weight:800;letter-spacing:-.02em;color:${color};font-variant-numeric:tabular-nums">${pct.toFixed(0)}%</span>
            <span style="font-size:13.5px;color:var(--t2);padding-bottom:6px">${fmtH(usadas)} de ${fmtH(contratadas)} usadas</span>
          </div>
          <div style="height:14px;border-radius:8px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)">
            <span style="display:block;height:100%;width:${pct}%;background:${color};border-radius:8px 0 0 8px"></span>
          </div>
          <div class="kpi4">
            ${kpi('Contratadas', fmtH(contratadas), `${tenantUsage.plano}h cotas + ${tenantUsage.extras}h extras`)}
            ${kpi('Usadas', fmtH(usadas), `${totMeets} reuniões`)}
            ${kpi('Restantes', fmtH(restantes), 'até a renovação', restantes<=0?'var(--crit)':'')}
            ${kpi('Projeção', fmtH(proj), projOver?'acima do contratado':'dentro do plano', projOver?'var(--warn)':'var(--success)')}
          </div>
          ${projOver?`<div class="banner" style="margin:0;padding:11px 13px;background:var(--warnDim);border:1px solid rgba(245,158,11,.3);border-radius:10px;color:var(--warn)">${sv(I.shield,1.8,14)} No ritmo atual, a equipe deve passar da cota antes da renovação. Contrate horas ao lado para não interromper as gravações.</div>`:''}
        </div>

        ${savedCard}
        ${reqCard}

        <div class="card" style="padding:8px 8px 4px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap">
            <div class="sec-title" style="margin:0">Cota por usuário</div>
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-size:12px;color:var(--t3)">${team.length} com o módulo liberado</span>
              <button class="btn btn-sm btn-outline" data-adduser-open="1" style="height:32px">${sv(I.plus,2,14)}Liberar acesso</button>
            </div>
          </div>
          <div style="overflow-x:auto"><table class="utable">
            <thead><tr><th>Usuário</th><th style="text-align:center">Reuniões</th><th>Consumo (usado / cota)</th><th style="text-align:right">% da cota</th></tr></thead>
            <tbody>${rows}
              <tr class="totrow"><td>Total da equipe</td><td style="text-align:center;font-variant-numeric:tabular-nums">${totMeets}</td><td style="font-variant-numeric:tabular-nums">${fmtH(usadas)} / ${fmtH(contratadas)}</td><td style="text-align:right">${Math.round(pct)}%</td></tr>
            </tbody>
          </table></div>
        </div>
      </div>

      <!-- RECHARGE -->
      <div class="card" style="padding:22px 22px;display:flex;flex-direction:column;gap:16px">
        <div class="sec-title" style="margin:0"><span class="ai-badge" style="background:var(--accentDim);border-color:var(--accentBorder);color:var(--accent)">${sv(I.plus,2,15)}</span>Contratar mais horas</div>
        <p style="margin:0;font-size:13px;color:var(--t2);line-height:1.55">Aumenta o pool do workspace. Use para liberar mais horas às cotas quando o pool estiver no limite.</p>
        <input type="range" class="rng" id="rechargeRange" min="2" max="100" step="1" value="${rechargeHours}" aria-label="Horas a contratar">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums"><span>2h</span><span>25h</span><span>50h</span><span>100h</span></div>
        <div style="background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:16px">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;color:var(--t2)">Horas</span><b id="rcHours" style="font-size:16px;font-variant-numeric:tabular-nums">${rechargeHours} h</b></div>
          <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px">
            <span style="font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums" id="rcPrice"></span>
            <span style="font-size:12px;color:var(--t3)">no total · R$ ${RECHARGE_RATE},00/h</span>
          </div>
          <div style="font-size:11.5px;color:var(--t3);margin-top:6px">Novo total do mês: <b id="rcNew" style="color:var(--tc)"></b></div>
        </div>
        <button class="btn btn-primary" data-buy-hours="1" style="width:100%;justify-content:center;height:46px">${sv(I.plus,2,16)}Contratar horas</button>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;font-size:11.5px;color:var(--t3)">
          <span class="chip">Pix</span><span class="chip">Cartão</span>
        </div>
        <p class="banner" style="margin:0">${sv(I.shield,1.8,13)} Só administradores contratam horas. Cobrança via Pix ou cartão.</p>
      </div>
    </div>`;

  const rng=$('#rechargeRange');
  const syncRecharge=()=>{
    rechargeHours=parseInt(rng.value,10);
    const total = poolContratadas() + rechargeHours;
    rng.style.setProperty('--pct', ((rechargeHours-2)/(100-2)*100).toFixed(1)+'%');
    $('#rcHours').textContent = rechargeHours+' h';
    $('#rcPrice').textContent = 'R$ '+(rechargeHours*RECHARGE_RATE).toLocaleString('pt-BR');
    $('#rcNew').textContent = fmtH(total);
  };
  if(rng){rng.oninput=syncRecharge;syncRecharge();}
}

/* ---------- router ---------- */
function render(){
  renderSidebar();
  updateChrome();
  if(route.name==='home') renderHome();
  else if(route.name==='list') renderList();
  else if(route.name==='new') renderNew();
  else if(route.name==='record') renderRecord();
  else if(route.name==='help') renderHelp();
  else if(route.name==='admin') renderAdmin();
  else renderDetail();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(notifOpen && !e.target.closest('#notifPanel') && !e.target.closest('#notifBtn')){notifOpen=false;const p=$('#notifPanel');if(p)p.hidden=true;}
  const t=e.target.closest('[data-open],[data-nav],[data-filter],[data-tab],[data-issue],[data-confirm],[data-close],[data-reprocess],[data-archive],[data-rec-stop],[data-rec-toggle],[data-rec-transcribe],[data-rec-discard],[data-note-add],[data-note-cancel],[data-note-save],[data-note-del],[data-audio-toggle],[data-copy-resumo],[data-copy-transcript],[data-edit-transcript],[data-save-transcript],[data-cancel-transcript],[data-role],[data-buy-hours],[data-notif-toggle],[data-notif-readall],[data-req-open],[data-req-tipo],[data-req-submit],[data-req-approve],[data-deny-open],[data-deny-confirm],[data-share-open],[data-share-toggle],[data-dl-audio],[data-ask-share],[data-adduser-open],[data-adduser-toggle],[data-adduser-confirm]');
  if(!t)return;
  if(t.dataset.audioToggle){toggleAudio();return;}
  if(t.dataset.notifToggle){notifOpen=!notifOpen;const p=$('#notifPanel');if(p)p.hidden=!notifOpen;return;}
  if(t.dataset.notifReadall){const aud=isAdmin?'admin':'user'+CURRENT_USER_ID;notifications.forEach(n=>{if(n.audience===aud)n.read=true;});updateChrome();return;}
  if(t.dataset.reqOpen){openRequestModal();return;}
  if(t.dataset.reqTipo){reqForm.tipo=t.dataset.reqTipo;openRequestModal();return;}
  if(t.dataset.reqSubmit){submitRequest();return;}
  if(t.dataset.reqApprove){approveRequest(t.dataset.reqApprove);return;}
  if(t.dataset.denyOpen){openDenyModal(t.dataset.denyOpen);return;}
  if(t.dataset.denyConfirm){const reason=(($('#denyReason')||{}).value||'').trim();if(!reason){toast('Escreva o motivo da recusa.');return;}closeModal();denyRequest(t.dataset.denyConfirm,reason);return;}
  if(t.dataset.shareOpen){openShareModal(t.dataset.shareOpen);return;}
  if(t.dataset.shareToggle){const[mid,uid]=t.dataset.shareToggle.split(':');toggleShare(mid,uid);return;}
  if(t.dataset.adduserOpen){addSel=new Set();openAddUsersModal();return;}
  if(t.dataset.adduserToggle){toggleAddUser(t.dataset.adduserToggle);return;}
  if(t.dataset.adduserConfirm){confirmAddUsers();return;}
  if(t.dataset.dlAudio){toast('Baixando a gravação no formato original (WEBM/Opus)… (mock)');return;}
  if(t.dataset.askShare){route={name:'list',id:null,tab:'resumo'};render();toast('Pedido de compartilhamento enviado (mock).');return;}
  if(t.dataset.role){isAdmin=!isAdmin;notifOpen=false;if(!isAdmin&&route.name==='admin')route={name:'list',id:null,tab:'resumo'};render();toast(isAdmin?'Visão do Admin master.':'Visão do usuário do módulo.');return;}
  if(t.dataset.buyHours){const h=rechargeHours;tenantUsage.extras+=h;const total=poolContratadas();render();toast(`Contratadas ${h} h por R$ ${(h*RECHARGE_RATE).toLocaleString('pt-BR')} (Pix/cartão — mock). Novo total: ${fmtH(total)}.`);return;}
  if(t.dataset.open){stopRecTimer();clearAudio();notesAdding=false;transcriptEditing=false;notifOpen=false;route={name:'detail',id:t.dataset.open,tab:'resumo'};render();}
  else if(t.dataset.nav){stopRecTimer();clearAudio();notesAdding=false;transcriptEditing=false;notifOpen=false;const n=t.dataset.nav;
    if((n==='new'||n==='record')&&!isAdmin&&userPct(curUser())>=100){openRequestModal();toast('Cota do mês atingida — solicite mais horas para novas gravações.');return;}
    if(n==='record'){rec={sec:0,timer:null,shareAudio:true,stopped:false,title:'Reunião — '+new Date().toLocaleDateString('pt-BR'),project:'Rautaki'};route={name:'record'};}
    else route={name:(n==='new'||n==='help'||n==='admin'||n==='home')?n:'list',id:null,tab:'resumo'};
    render();}
  else if(t.dataset.filter){filter=t.dataset.filter;renderList();}
  else if(t.dataset.tab){notesAdding=false;transcriptEditing=false;route.tab=t.dataset.tab;renderDetail();}
  else if(t.dataset.archive){const m=find(t.dataset.archive);if(m)m.archived=true;stopRecTimer();clearAudio();notesAdding=false;transcriptEditing=false;route={name:'list',id:null,tab:'resumo'};render();toast('Reunião arquivada — fica 30 dias no repositório.');}
  else if(t.dataset.copyResumo){const m=find(t.dataset.copyResumo);if(m)copyText(ataText(m),'Ata copiada para a área de transferência.');}
  else if(t.dataset.copyTranscript){const m=find(t.dataset.copyTranscript);if(m)copyText(transcriptText(m),'Transcrição copiada.');}
  else if(t.dataset.editTranscript){transcriptEditing=true;renderDetail();}
  else if(t.dataset.cancelTranscript){transcriptEditing=false;renderDetail();}
  else if(t.dataset.saveTranscript){const m=find(t.dataset.saveTranscript);
    document.querySelectorAll('.tedit').forEach(el=>{const i=+el.dataset.tidx;if(m&&m.transcript[i])m.transcript[i].text=el.innerText.replace(/\s+/g,' ').trim();});
    transcriptEditing=false;renderDetail();toast('Transcrição atualizada.');}
  else if(t.dataset.recStop){rec.stopped=true;stopRecTimer();renderRecord();}
  else if(t.dataset.recToggle){rec.shareAudio=!rec.shareAudio;renderRecord();if(rec.shareAudio)toast('No app real, aqui o navegador abriria o compartilhamento de aba.');}
  else if(t.dataset.recTranscribe){stopRecTimer();generate(rec.title,rec.project,'record',fmtDur(rec.sec));}
  else if(t.dataset.recDiscard){stopRecTimer();route={name:'new'};render();}
  else if(t.dataset.noteAdd){notesAdding=true;renderDetail();}
  else if(t.dataset.noteCancel){notesAdding=false;renderDetail();}
  else if(t.dataset.noteSave){const m=find(t.dataset.noteSave);const body=($('#notebody')||{}).value?.trim();const ts=($('#notets')||{}).value?.trim();
    if(!body){toast('Escreva o apontamento.');return;}
    (m.notes||(m.notes=[])).unshift({id:'n'+Date.now(),ts:ts&&/^\d{1,2}:\d{2}$/.test(ts)?ts:null,author:'Você',ag:0,body});
    notesAdding=false;renderDetail();toast('Apontamento salvo.');}
  else if(t.dataset.noteDel){const[mid,nid]=t.dataset.noteDel.split(':');const m=find(mid);m.notes=(m.notes||[]).filter(x=>x.id!==nid);renderDetail();toast('Apontamento removido.');}
  else if(t.dataset.issue){const[m,a]=t.dataset.issue.split(':');openIssueModal(m,a);}
  else if(t.dataset.confirm){const[m,a]=t.dataset.confirm.split(':');confirmIssue(m,a);}
  else if(t.dataset.close){closeModal();}
  else if(t.dataset.createall){const m=find(t.dataset.createall);let n=0;m.actionItems.forEach(a=>{if(!a.issue){a.issue='RAU-'+(issueSeq++);n++;}});render();if(n)toast(n+' issue(s) criada(s) no board.');}
  else if(t.dataset.reprocess){const m=find(t.dataset.reprocess);m.status='processing';render();setTimeout(()=>{m.status='ready';if(!m.summary){m.summary='Resumo gerado após reprocessamento.';m.objetivo='Revisar a sprint 7 e levantar melhorias.';m.assunto='Retrospectiva — o que manter, o que melhorar.';m.itensDiscutidos=['Pontos positivos da sprint.','Impedimentos recorrentes.'];m.pontosDefinir=['Ação para reduzir retrabalho.'];m.decisions=['Adotar revisão de código em par.'];m.actionItems=[{id:'r1',text:'Encaminhamento da retrospectiva',assignee:'Yago',ag:0,due:'esta semana',issue:null}];m.transcript=[{ts:'00:01',who:'Yago',text:'Reprocessado.'}];if(!m.people.length)m.people=[{n:'Você',g:0}];}render();toast('Reprocessado com sucesso.');},1600);}
  else if(t.dataset.send){sendChat(t.dataset.send);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='chatinput'){
    const send=document.querySelector('[data-send]');if(send)sendChat(send.dataset.send);
  }
});
function sendChat(mid){
  const inp=$('#chatinput');if(!inp||!inp.value.trim())return;
  const m=find(mid),q=inp.value.trim();
  chatByMeeting[mid].push({role:'user',text:q});
  renderDetail();
  setTimeout(()=>{chatByMeeting[mid].push({role:'bot',text:botReply(m,q)});renderDetail();},450);
}

render();
</script>
